@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Press+Start+2P&display=swap');:root{--ink:#172a2c;--cream:#f6edce;--gold:#ffcf69}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14282d;color:var(--cream);font-family:'DM Mono',monospace;touch-action:none}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#385b4c,#1d3938 55%,#12272d)}#game{position:relative;width:min(100vw,calc(100dvh * 1.7778));aspect-ratio:16/9;max-height:100dvh;overflow:hidden;background:#273f38;box-shadow:0 20px 70px #08181c99;border:1px solid #d5bd7744}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.topbar{position:absolute;inset:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;padding:clamp(8px,2vw,18px);pointer-events:none;background:linear-gradient(#142a2dc9,transparent)}.brand{font-family:'Press Start 2P',monospace;font-size:clamp(7px,1vw,11px);line-height:1.75;color:#ffdc91;text-shadow:2px 2px #553c34}.brand small{display:block;font:10px 'DM Mono';letter-spacing:.13em;color:#d4dfbd;margin-top:3px}.status{display:flex;gap:8px;align-items:center;font-size:clamp(9px,1.1vw,13px)}.pill{background:#142c31dd;border:1px solid #f7e1a555;padding:7px 10px;border-radius:4px;box-shadow:0 2px #101f21}.hearts{color:#ff8370;letter-spacing:2px;font-size:16px}.bottom{position:absolute;inset:auto 0 0;display:flex;justify-content:space-between;align-items:end;padding:clamp(8px,1.8vw,16px);pointer-events:none;background:linear-gradient(transparent,#11272bd9)}.quest{max-width:min(54%,390px);background:#142c31e8;border:1px solid #f6e5ae55;border-left:3px solid var(--gold);padding:10px 12px;border-radius:3px;font-size:clamp(9px,1.05vw,12px);line-height:1.5;box-shadow:0 3px #101f21}.quest b{display:block;font-size:10px;color:var(--gold);letter-spacing:.12em;margin-bottom:4px}.quest span{color:#d8dfc7}.hint{font-size:clamp(8px,.9vw,11px);color:#e8e4c9;text-align:right;line-height:1.6;text-shadow:1px 2px #172a2c}.hint kbd{border:1px solid #ecdda988;border-radius:3px;padding:2px 5px;background:#183338}.toast{position:absolute;left:50%;top:19%;transform:translate(-50%,-10px);background:#152c31ee;border:1px solid #f0d99888;color:#fff2cb;padding:10px 16px;font-size:12px;border-radius:3px;opacity:0;transition:.22s;pointer-events:none;text-align:center;max-width:85%}.toast.show{opacity:1;transform:translate(-50%,0)}.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,86%);background:#192f33f5;border:2px solid #d9bf76;box-shadow:0 0 0 5px #14272dcc,0 12px 40px #101b20aa;padding:20px;display:none;text-align:center}.panel.open{display:block}.panel h2{font:12px 'Press Start 2P';color:var(--gold);line-height:2}.panel p{font-size:12px;line-height:1.8;color:#e8e3cb}.panel button{font:10px 'DM Mono';color:#1b3030;background:#f3d37e;border:0;padding:10px 16px;cursor:pointer;margin-top:8px}.touch{display:none;position:absolute;inset:0;pointer-events:none}.stick{position:absolute;bottom:15%;left:5%;width:112px;height:112px;border-radius:50%;background:#10282b66;border:2px solid #f6e4aa66;pointer-events:auto;touch-action:none}.nub{position:absolute;width:42px;height:42px;left:33px;top:33px;background:#e8d18c99;border:2px solid #fff0c888;border-radius:50%}.actions{position:absolute;right:4%;bottom:14%;display:flex;gap:12px;align-items:end;pointer-events:auto}.act{width:58px;height:58px;border-radius:50%;border:2px solid #f5df9b99;background:#183438cc;color:#f8df98;font:9px 'DM Mono';box-shadow:0 3px #0e2225;touch-action:none}.act.attack{width:72px;height:72px;background:#9c4b42dd;color:#fff0c9}.act:active{transform:translateY(2px);filter:brightness(1.3)}#sound{position:absolute;right:12px;top:60px;border:1px solid #f7e1a555;color:#ffdda0;background:#142c31cc;padding:5px 8px;font:12px monospace;pointer-events:auto;cursor:pointer}.mobile-note{display:none}
@media (pointer:coarse),(max-width:700px){.touch{display:block}.hint{display:none}.topbar{padding:9px}.bottom{padding:9px}.quest{max-width:58%;padding:7px 9px}.pill{padding:5px 7px}.brand small{font-size:8px}.mobile-note{display:block;position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:7px;color:#e6d9ac99;white-space:nowrap;pointer-events:none}}

</style></head><body><main id="game"><canvas id="screen" aria-label="Emberwild pixel art RPG"></canvas>
<div class="topbar"><div class="brand">EMBERWILD<small>THE GREENWOLD FRONTIER</small></div><div class="status"><div class="pill hearts" id="hearts">♥♥♥</div><div class="pill">✦ <span id="level">1</span></div><div class="pill">◈ <span id="gold">0</span></div></div></div><button id="sound" aria-label="Toggle sound">♫</button>
<div class="bottom"><div class="quest"><b id="questTitle">✧ A STRANGER’S REQUEST</b><span id="questText">Find Mira near the old stone well.</span></div><div class="hint"><kbd>WASD</kbd> move · <kbd>SPACE</kbd> strike<br><kbd>E</kbd> talk / gather · <kbd>M</kbd> map</div></div>
<div class="touch"><div class="stick" id="stick"><div class="nub" id="nub"></div></div><div class="actions"><button class="act" id="interact">TALK<br>GATHER</button><button class="act attack" id="attack">⚔<br>STRIKE</button></div><div class="mobile-note">DRAG TO MOVE · TAP TO EXPLORE</div></div><div class="toast" id="toast"></div><section class="panel" id="panel"><h2 id="panelTitle">EMBERWILD</h2><p id="panelText"></p><button id="panelButton">CONTINUE</button></section>
<script>(()=>{'use strict';
const canvas=document.querySelector('#screen'),ctx=canvas.getContext('2d',{alpha:false}),game=document.querySelector('#game'),TILE=16,MW=72,MH=72,world=[],decor=[],enemies=[],herbs=[],keys=new Set();let viewW=480,viewH=270,last=0,toastTimer=0,dialogue=null,mapOpen=false,walk=0,attackFlash=0,attackCd=0;const player={x:34*TILE,y:38*TILE,hp:3,maxHp:3,gold:0,xp:0,level:1,dir:'down',invuln:0};let quest=Number(localStorage.getItem('emberQuest')||0),herbCount=Number(localStorage.getItem('emberHerbs')||0),muted=false,audio=null;const rand=(x,y)=>{let n=Math.sin(x*127.1+y*311.7+6.17)*43758.5453;return n-Math.floor(n)};function resize(){const r=game.getBoundingClientRect(),aspect=r.width/r.height;viewW=Math.max(320,Math.round(480*Math.min(1,r.width/760)));viewH=Math.max(180,Math.round(viewW/aspect));canvas.width=viewW;canvas.height=viewH}new ResizeObserver(resize).observe(game);resize();function tile(x,y){return world[y]?.[x]??'water'}function nearVillage(x,y){return x>24&&x<45&&y>27&&y<45}
function setWorld(){for(let y=0;y<MH;y++){world[y]=[];for(let x=0;x<MW;x++){let edge=Math.min(x,y,MW-1-x,MH-1-y),n=rand(x,y),g=Math.sin(x*.17)+Math.cos(y*.14)+Math.sin((x+y)*.09);world[y][x]=edge<3?'water':g+n*1.3>1.3?'forest':g+n>-.25?'grass':'flowers'}}for(let y=26;y<48;y++)for(let x=23;x<47;x++)world[y][x]='grass';for(let y=30;y<44;y++)for(let x=26;x<43;x++)world[y][x]='path';for(let y=33;y<38;y++)for(let x=31;x<37;x++)world[y][x]='stone';for(let y=0;y<MH;y++){let x=Math.round(12+Math.sin(y*.19)*2);for(let dx=-1;dx<=1;dx++)world[y][x+dx]='water';if(y>25&&y<33)for(let dx=-1;dx<=1;dx++)world[y][x+dx]='bridge'}for(let i=0;i<34;i++){let x=34+Math.round(Math.sin(i*.22)*i*.38),y=45+i;for(let dx=-1;dx<=1;dx++)if(x+dx>0&&x+dx<MW&&y<MH)world[y][x+dx]='path'}for(let i=0;i<36;i++){let x=42+i,y=38+Math.round(Math.sin(i*.2)*4);if(x<MW-2)world[y][x]='path'}for(let y=2;y<MH-2;y++)for(let x=2;x<MW-2;x++){if(['grass','forest'].includes(tile(x,y))&&rand(x+81,y)<.11&&!nearVillage(x,y))decor.push({type:rand(x,y+3)>.62?'tree':'bush',x,y});else if(tile(x,y)==='flowers'&&rand(x+10,y)<.16)decor.push({type:'flower',x,y})}const add=(type,x,y,w=1,h=1)=>decor.push({type,x,y,w,h});add('house',28,30,4,3);add('houseBlue',39,32,3,3);add('well',33,35);add('sign',27,39);add('lantern',38,39);add('ruin',55,17,3,2);add('shrine',60,52,2,2);decor.push({type:'mira',x:35,y:37});for(let i=decor.length-1;i>=0;i--)if(nearVillage(decor[i].x,decor[i].y)&&['tree','bush'].includes(decor[i].type))decor.splice(i,1);for(const [x,y]of[[48,31],[51,42],[59,22],[22,52],[62,47],[17,18]])enemies.push({x:x*TILE,y:y*TILE,hp:2,alive:true,homeX:x*TILE,homeY:y*TILE,phase:rand(x,y)*8,hit:0});for(const [x,y]of[[47,34],[49,35],[52,37],[50,40],[58,25],[57,27],[21,49],[24,51],[61,44]])herbs.push({x,y,taken:false})}setWorld();
function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function text(s,x,y,size=7,color='#fff0c9'){ctx.fillStyle=color;ctx.font=`${size}px monospace`;ctx.textAlign='center';ctx.fillText(s,Math.round(x),Math.round(y))}const colors={grass:['#679754','#719f59','#5b884e'],forest:['#426d4e','#4b7954','#3b654a'],flowers:['#7eaa5e','#8ab367','#709651'],path:['#c0a36b','#cbb27b','#b89c65'],stone:['#8c8d75','#9b9b80','#7e806e'],water:['#397f89','#438e97','#337580'],bridge:['#a57a4e','#b58b58','#916b49']};
function drawTile(x,y,tx,ty){let C=colors[y]||colors.grass,n=rand(tx,ty);box(x,y,TILE,TILE,C[Math.floor(n*3)]);if(y==='water'){box(x+3+Math.floor(n*6),y+5,8,1,'#73b5ac');if(rand(tx+9,ty)<.09)box(x+10,y+11,2,1,'#c0d8a1')}else if(y==='path'){box(x+3,y+4,2,1,'#dfc894');if(n>.6)box(x+11,y+12,2,1,'#9b815b')}else if(y==='bridge'){for(let i=2;i<TILE;i+=5)box(x+i,y,1,TILE,'#876443');box(x,y+3,TILE,1,'#d1a96a')}else if(y==='stone'){box(x+2,y+2,5,2,'#aaa992');box(x+9,y+10,5,2,'#717466')}else if(n>.75)box(x+2+Math.floor(n*8),y+4,1,1,'#b7cf78')}
function drawDecor(d,cx,cy){let x=d.x*TILE-cx,y=d.y*TILE-cy,T=TILE;switch(d.type){case'tree':box(x+4,y+9,8,7,'#724d3b');box(x+1,y+1,14,10,'#285640');box(x+3,y-2,10,8,'#39734c');box(x+5,y,3,2,'#6d9d59');break;case'bush':box(x+2,y+7,12,8,'#3c7047');box(x+4,y+4,8,8,'#4e8650');box(x+4,y+7,2,2,'#9cbe68');break;case'flower':box(x+8,y+7,2,7,'#407c4d');box(x+7,y+5,4,3,rand(d.x,d.y)>.5?'#f2df9d':'#e99585');break;case'house':case'houseBlue':{let w=d.w*T,h=d.h*T;box(x+4,y+h-3,w-7,4,'#3b4637');box(x+3,y+8,w-6,h-8,d.type==='house'?'#d9b677':'#9bbab0');box(x,y+4,w,10,d.type==='house'?'#944f42':'#496d80');box(x+4,y,w-8,8,d.type==='house'?'#b9634d':'#60889a');box(x+7,y-3,3,5,'#c37858');box(x+8,y+14,6,6,'#543d35');box(x+7,y+13,8,2,'#e1c987');box(x+22,y+14,6,5,'#8dc2bd');break}case'well':box(x+2,y+9,12,5,'#777c70');box(x+3,y+7,10,3,'#a5a18a');box(x+5,y+8,6,2,'#315b62');box(x+3,y+4,2,6,'#755b41');box(x+11,y+4,2,6,'#755b41');box(x+4,y+3,8,2,'#a5794d');break;case'sign':box(x+7,y+8,2,8,'#795638');box(x+3,y+4,10,6,'#b68b53');box(x+5,y+6,6,1,'#edd392');break;case'lantern':box(x+7,y+5,2,10,'#684e3b');box(x+5,y+3,6,6,'#e0ad5d');box(x+6,y+4,4,4,'#fff0a2');break;case'ruin':box(x+1,y+9,14,5,'#697d6a');box(x+3,y+5,3,8,'#9a9c7d');box(x+10,y+4,3,9,'#92977a');box(x+2,y+3,5,3,'#a8a78a');box(x+9,y+2,5,3,'#a4a48a');break;case'shrine':box(x+2,y+10,12,5,'#836345');box(x+4,y+4,2,8,'#ddd0a0');box(x+10,y+4,2,8,'#ddd0a0');box(x+3,y+2,10,3,'#b58554');box(x+6,y+7,4,5,'#dfc778');break;case'mira':box(x+3,y+11,10,4,'#314437');box(x+5,y+5,7,9,'#547fa1');box(x+4,y+2,8,5,'#a66c49');box(x+5,y+1,7,3,'#e5bf7d');box(x+6,y+4,1,1,'#342c29');box(x+10,y+4,1,1,'#342c29');if(Math.sin(performance.now()/250)>-.1)text('!',x+8,y-4,9,'#ffdf84');break}}
function actor(x,y,dir,frame,color='#466e9d',accent='#e9c574'){let bob=Math.sin(frame*9)*1.1;x=Math.round(x);y=Math.round(y+bob);box(x-5,y+5,10,3,'#203c36aa');box(x-4,y-5,8,10,color);box(x-3,y-9,7,6,'#d9a77d');box(x-4,y-10,8,3,accent);if(dir==='left')box(x-4,y-7,1,1,'#292925');else if(dir==='right')box(x+2,y-7,1,1,'#292925');else{box(x-2,y-7,1,1,'#292925');box(x+2,y-7,1,1,'#292925')}box(x-3,y+4,3,3,'#493f37');box(x+1,y+4+(Math.sin(frame*10)>0?1:0),3,3,'#493f37')}
function drawEnemy(e,cx,cy){let x=e.x-cx,y=e.y-cy+Math.sin(e.phase)*2;box(x-7,y+5,14,5,'#203d36aa');box(x-7,y-3,14,10,e.hit>0?'#fff2b0':'#72b77c');box(x-4,y-6,9,7,e.hit>0?'#fff2b0':'#90d391');box(x-3,y,2,2,'#293c30');box(x+2,y,2,2,'#293c30')}
function drawMap(){box(0,0,viewW,viewH,'#13282bdc');let size=Math.min(viewH*.7,viewW*.66),x=(viewW-size)/2,y=(viewH-size)/2;box(x-5,y-5,size+10,size+10,'#293d35');for(let yy=0;yy<MH;yy++)for(let xx=0;xx<MW;xx++){let t=tile(xx,yy),c=t==='water'?'#467f85':t==='forest'?'#456348':t==='path'?'#bea574':t==='stone'?'#999780':'#71925c';ctx.fillStyle=c;ctx.fillRect(x+xx/MW*size,y+yy/MH*size,size/MW+.5,size/MH+.5)}ctx.fillStyle='#ffdf86';ctx.fillRect(x+player.x/(MW*TILE)*size-2,y+player.y/(MH*TILE)*size-2,5,5);text('GREENWOLD FRONTIER',viewW/2,y-12,9,'#f8e8b7');text('M  ·  CLOSE MAP',viewW/2,y+size+17,8,'#e7d8ac')}
function render(){let cx=Math.max(0,Math.min(MW*TILE-viewW,player.x-viewW/2)),cy=Math.max(0,Math.min(MH*TILE-viewH,player.y-viewH/2));box(0,0,viewW,viewH,'#397b86');let sx=Math.floor(cx/TILE),sy=Math.floor(cy/TILE);for(let y=sy;y<=sy+Math.ceil(viewH/TILE)+1;y++)for(let x=sx;x<=sx+Math.ceil(viewW/TILE)+1;x++)drawTile(x*TILE-cx,y*TILE-cy,tile(x,y),x,y);for(const h of herbs)if(!h.taken){let x=h.x*TILE-cx,y=h.y*TILE-cy;box(x+7,y+8,2,6,'#398451');box(x+4,y+6,4,3,'#a6d77e');box(x+9,y+4,4,3,'#badf8c');box(x+7,y+3,2,2,'#f1e8a4')}let visible=decor.filter(d=>d.x*TILE-cx>-60&&d.x*TILE-cx<viewW+60&&d.y*TILE-cy>-50&&d.y*TILE-cy<viewH+50).sort((a,b)=>a.y-b.y);for(const d of visible)drawDecor(d,cx,cy);for(const e of enemies)if(e.alive&&e.x-cx>-20&&e.x-cx<viewW+20&&e.y-cy>-20&&e.y-cy<viewH+20)drawEnemy(e,cx,cy);actor(player.x-cx,player.y-cy,player.dir,walk,player.invuln>0&&Math.floor(performance.now()/90)%2?'#f7efe0':'#466e9d','#e9c574');if(attackFlash>0){let dx=player.dir==='left'?-12:player.dir==='right'?12:0,dy=player.dir==='up'?-10:player.dir==='down'?10:0;ctx.strokeStyle='#fff0a6';ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x-cx+dx,player.y-cy+dy,12,-.9,1.3);ctx.stroke()}if(mapOpen)drawMap();updateUI()}
function updateUI(){document.querySelector('#hearts').textContent='♥'.repeat(player.hp)+'♡'.repeat(player.maxHp-player.hp);document.querySelector('#level').textContent=player.level;document.querySelector('#gold').textContent=player.gold;let t=['Find Mira near the old stone well.','Gather 3 moon herbs in the eastern meadow.','Return to Mira with the moon herbs.','The village is safe. Explore the Greenwold!'];document.querySelector('#questText').textContent=t[Math.min(quest,3)];document.querySelector('#questTitle').textContent=['✧ A STRANGER’S REQUEST','✧ MOON HERB REMEDY','✧ BACK TO THE VILLAGE','✧ THE WORLD IS YOURS'][Math.min(quest,3)]}
function showToast(s){let el=document.querySelector('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}function panel(title,content,button='CONTINUE',action=null){dialogue=action;document.querySelector('#panelTitle').textContent=title;document.querySelector('#panelText').innerHTML=content;document.querySelector('#panelButton').textContent=button;document.querySelector('#panel').classList.add('open')}function closePanel(){document.querySelector('#panel').classList.remove('open');let fn=dialogue;dialogue=null;if(fn)fn()}document.querySelector('#panelButton').addEventListener('click',closePanel);function nearby(a,b,dist=23){return Math.hypot(a.x-b.x,a.y-b.y)<dist}
function interact(){if(document.querySelector('#panel').classList.contains('open'))return;let mira=decor.find(d=>d.type==='mira');if(nearby(player,{x:(mira.x+.5)*TILE,y:(mira.y+.5)*TILE},28)){if(quest===0){panel('MIRA OF GREENWOLD','“The slimes have soured our well. Could you find <b>three moon herbs</b> in the eastern meadow? They glow pale gold after the rain.”','I’LL HELP',()=>{quest=1;persist();showToast('Quest started: gather 3 moon herbs')});return}if(quest===1){panel('MIRA OF GREENWOLD',`“The moon herbs grow east of the village. You’ve found <b>${herbCount}/3</b> so far.”`,'GOT IT');return}if(quest===2){panel('MIRA OF GREENWOLD','“These are perfect! The water will be sweet again by morning. Please, take this for your trouble.”','THANK YOU',()=>{quest=3;player.gold+=25;player.xp+=30;levelCheck();persist();showToast('Quest complete! +25 gold · +30 XP')});return}panel('MIRA OF GREENWOLD','“The well is clear, thanks to you! There’s more to this world than our little village. Follow the old trail east to the ruins.”','GOODBYE');return}let dist=Infinity,chosen=null;for(const d of decor){if(d.type==='sign'||d.type==='well'){let q={x:(d.x+.5)*TILE,y:(d.y+.5)*TILE},dd=Math.hypot(player.x-q.x,player.y-q.y);if(dd<dist){dist=dd;chosen=d}}}if(chosen&&dist<30){if(chosen.type==='sign')panel('VILLAGE NOTICE','“Welcome to Greenwold. Moon herbs grow in the sunny meadow east of here. Beware the slimes beyond the lantern road.”','CLOSE');else panel('THE OLD WELL','A faint green shimmer ripples beneath the stones. Mira might know what’s wrong.','CLOSE');return}for(const h of herbs)if(!h.taken&&Math.hypot(player.x-(h.x+.5)*TILE,player.y-(h.y+.5)*TILE)<25){h.taken=true;herbCount++;player.xp+=5;levelCheck();persist();showToast(`Moon herb gathered · ${herbCount}/3`);if(quest===1&&herbCount>=3){quest=2;persist();showToast('You have enough herbs. Return to Mira!')}return}showToast('Nothing to gather nearby.')}
function levelCheck(){if(player.xp>=player.level*30){player.xp-=player.level*30;player.level++;player.maxHp=Math.min(5,player.maxHp+1);player.hp=player.maxHp;showToast(`Level up! You are now level ${player.level}`)}}function persist(){localStorage.setItem('emberQuest',quest);localStorage.setItem('emberHerbs',herbCount)}function playTone(freq,duration,type='sine'){if(muted)return;try{audio??=new AudioContext();let osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(.035,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch{}}
function attack(){if(attackCd>0)return;attackCd=.38;attackFlash=.18;playTone(190,.08,'square');let hit=false;for(const e of enemies){if(!e.alive||Math.hypot(e.x-player.x,e.y-player.y)>30)continue;let dx=e.x-player.x,dy=e.y-player.y,face={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[player.dir];if(dx*face[0]+dy*face[1]<-4)continue;e.hp--;e.hit=.15;hit=true;if(e.hp<=0){e.alive=false;player.gold+=2+Math.floor(rand(e.homeX,e.homeY)*4);player.xp+=10;levelCheck();showToast('Slime defeated · +'+'gold')}else showToast('A solid hit!')}if(!hit&&enemies.some(e=>e.alive&&Math.hypot(e.x-player.x,e.y-player.y)<45))showToast('Face the slime and strike!')}
function canWalk(px,py){let tx=Math.floor(px/TILE),ty=Math.floor(py/TILE);if(tx<0||ty<0||tx>=MW||ty>=MH)return false;let t=tile(tx,ty);if(t==='water'||t==='forest')return false;for(const d of decor){if(['house','houseBlue'].includes(d.type)&&px>d.x*TILE-3&&px<(d.x+d.w)*TILE+3&&py>d.y*TILE-2&&py<(d.y+d.h)*TILE-2)return false;if(['well','ruin','shrine'].includes(d.type)&&Math.abs(px-(d.x+.5)*TILE)<12&&Math.abs(py-(d.y+.5)*TILE)<12)return false}return true}let joy={x:0,y:0};function move(dt){let x=0,y=0;if(keys.has('ArrowLeft')||keys.has('a')||keys.has('A'))x--;if(keys.has('ArrowRight')||keys.has('d')||keys.has('D'))x++;if(keys.has('ArrowUp')||keys.has('w')||keys.has('W'))y--;if(keys.has('ArrowDown')||keys.has('s')||keys.has('S'))y++;x+=joy.x;y+=joy.y;let len=Math.hypot(x,y);if(len>1){x/=len;y/=len}if(len>.08){walk+=dt*8;if(Math.abs(x)>Math.abs(y))player.dir=x<0?'left':'right';else player.dir=y<0?'up':'down';let speed=68,nx=player.x+x*speed*dt,ny=player.y+y*speed*dt;if(canWalk(nx,player.y))player.x=nx;if(canWalk(player.x,ny))player.y=ny}else walk+=dt*1.6}
function bindStick(){let stick=document.querySelector('#stick'),nub=document.querySelector('#nub'),active=null;function update(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.34,len=Math.hypot(dx,dy);if(len>max){dx*=max/len;dy*=max/len}joy.x=dx/max;joy.y=dy/max;nub.style.transform=`translate(${dx}px,${dy}px)`}stick.addEventListener('pointerdown',e=>{active=e.pointerId;stick.setPointerCapture(active);update(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===active)update(e)});function end(e){if(e.pointerId!==active)return;active=null;joy={x:0,y:0};nub.style.transform=''}stick.addEventListener('pointerup',end);stick.addEventListener('pointercancel',end)}bindStick();document.querySelector('#attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});document.querySelector('#interact').addEventListener('pointerdown',e=>{e.preventDefault();interact()});document.querySelector('#sound').onclick=()=>{muted=!muted;document.querySelector('#sound').textContent=muted?'♫̸':'♫';if(!muted)playTone(600,.08)};window.addEventListener('keydown',e=>{if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key===' '){attack();return}if(e.key==='e'||e.key==='E'){interact();return}if(e.key==='m'||e.key==='M'){mapOpen=!mapOpen;return}if(e.key==='Escape'){if(document.querySelector('#panel').classList.contains('open'))closePanel();else mapOpen=false;return}keys.add(e.key)});window.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>keys.clear());function update(dt){if(document.querySelector('#panel').classList.contains('open'))return;move(dt);attackCd=Math.max(0,attackCd-dt);attackFlash=Math.max(0,attackFlash-dt);player.invuln=Math.max(0,player.invuln-dt);for(const e of enemies){if(!e.alive)continue;e.phase+=dt*4;e.hit=Math.max(0,e.hit-dt);let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy);if(d<115&&d>21){let nx=e.x+dx/d*dt*14,ny=e.y+dy/d*dt*14,t=tile(Math.floor(nx/TILE),Math.floor(ny/TILE));if(t!=='water'&&t!=='forest'){e.x=nx;e.y=ny}}else if(d>=115){e.x+=Math.sin(e.phase*.31)*dt*5;e.y+=Math.cos(e.phase*.27)*dt*4}if(d<17&&player.invuln===0){player.hp--;player.invuln=1.1;playTone(110,.16,'sawtooth');showToast(player.hp?'Ouch! The slime got you.':'You fainted… back to the village.');if(player.hp<=0){player.hp=player.maxHp;player.x=34*TILE;player.y=38*TILE;player.gold=Math.max(0,player.gold-5);showToast('You woke by the village well. Lost 5 gold.')}}}}function loop(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);if(!localStorage.getItem('emberStarted')){localStorage.setItem('emberStarted','1');setTimeout(()=>panel('WELCOME TO EMBERWILD','A quiet frontier, a village in trouble, and a wide world beyond. Speak to <b>Mira</b> beside the old well to begin. Explore, gather herbs, and keep an eye out for slimes!<br><br><span style="color:#ffdc91">WASD / arrows to move · E to interact · Space to strike · M for map</span>','LET’S GO'),350)}
})();</script></main></body></html>
